name: Verify and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ---------------------------------------------------------------------
  # 1) Backend checks (Python / FastAPI)
  # ---------------------------------------------------------------------
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python files compile (syntax check)
        run: python -m py_compile server.py

      - name: Run tests (if any)
        run: |
          if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "No tests found, skipping."
          fi

  # ---------------------------------------------------------------------
  # 2) Frontend checks (Expo / TypeScript)
  # ---------------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------
  # 3) Build Android APK via EAS (only if checks above pass)
  # ---------------------------------------------------------------------
  build-apk:
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Ensure EAS project is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json 2>/dev/null; then
            echo "No EAS project linked yet — configuring automatically..."
            eas init --non-interactive --force
          else
            echo "EAS project already configured."
          fi

      - name: Build APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Show build info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:list --platform android --limit 1 --non-interactive
