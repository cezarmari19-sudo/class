name: Verify and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ---------------------------------------------------------------------
  # 1) Backend checks (Python / FastAPI)
  # ---------------------------------------------------------------------
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python files compile (syntax check)
        run: python -m py_compile server.py

      - name: Run tests (if any)
        run: |
          if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "No tests found, skipping."
          fi

  # ---------------------------------------------------------------------
  # 2) Frontend checks (Expo / TypeScript)
  # ---------------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: TypeScript check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------
  # 3) Build Android APK via EAS (only if checks above pass)
  # ---------------------------------------------------------------------
  build-apk:
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Ensure EAS project is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json 2>/dev/null; then
            echo "No EAS project linked yet — configuring automatically..."
            eas init --non-interactive --force
          else
            echo "EAS project already configured."
          fi

      - name: Build APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Show build info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:list --platform android --limit 1 --non-interactive

      - name: Get APK download URL
        id: apk_url
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --limit 1 --non-interactive --json > builds.json
          echo "--- raw eas build:list output ---"
          cat builds.json
          echo "--- end raw output ---"
          URL=$(node -pe 'JSON.parse(require("fs").readFileSync("builds.json","utf8"))[0].artifacts.buildUrl')
          echo "Extracted URL: $URL"
          if [ -z "$URL" ] || [ "$URL" = "undefined" ]; then
            echo "::error::Could not extract APK build URL from eas build:list output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L "${{ steps.apk_url.outputs.url }}" -o app-release.apk

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/frontend/app-release.apk
          retention-days: 30